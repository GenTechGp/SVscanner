name: docker publish

# Builds the SVscanner container and publishes it to the GitHub Container Registry.
#
# Tags vX.Y.Z publish ghcr.io/<owner>/svscanner:X.Y.Z, :X.Y and :latest. Pull requests
# that touch the container build it and run the smoke tests without publishing, so a
# broken base image bump is caught before a release rather than during one.
#
# version-check.yml already guarantees that a vX.Y.Z tag sits on a commit whose VERSION
# file says X.Y.Z, so the image tag and `svscanner --version` cannot drift apart. The
# smoke test asserts it anyway.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/svscanner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=ci-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # Built into the local daemon first so the smoke tests run against the exact
      # image that is about to be published. The push below is a cache hit.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: svscanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - tools and versions
        run: |
          set -euo pipefail
          docker run --rm svscanner:ci svscanner --version
          docker run --rm svscanner:ci /opt/svscanner/scripts/check_required_python.sh
          docker run --rm svscanner:ci bash -eu -c '
            for tool in trf RepeatMasker parallel bcftools bgzip tabix; do
              command -v "$tool" || { echo "missing from PATH: $tool" >&2; exit 1; }
            done
            # Run them, do not just resolve them: bcftools links libhts dynamically and
            # has been shipped before in a state where it resolved but could not start.
            # No pipes - a pipeline would report the last command status and hide that.
            bcftools --version
            bgzip --version
            tabix --version
            RepeatMasker -v
          '

      - name: Smoke test - image version matches the VERSION file
        run: |
          set -euo pipefail
          expected=$(cat VERSION)
          reported=$(docker run --rm svscanner:ci svscanner --version)
          echo "VERSION file: ${expected}"
          echo "image says  : ${reported}"
          [[ "${reported}" == "SVscanner v${expected}" ]] \
            || { echo "::error::image reports '${reported}', expected 'SVscanner v${expected}'"; exit 1; }

      # The image carries Dfam 4.0, so RepeatMasker can run for real. One SVA_F copy from
      # hg38 (chr2:41746002-41748725) and its reverse complement: before RepeatMasker
      # 4.2.6 the forward copy came back as 3 lines and the reverse as 1
      # (Dfam-consortium/RepeatMasker#386). Both must be one SVA_F line. This also proves
      # the built-in human library resolves and RMBlast runs.
      - name: Smoke test - RepeatMasker on an SVA, both strands
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}/test/sva_strand_reproducer.fa:/in/sva.fa:ro" svscanner:ci bash -eu -c '
            mkdir -p /tmp/rm && cd /tmp/rm && cp /in/sva.fa .
            RepeatMasker -e rmblast -species human -pa 2 sva.fa > rm.log 2>&1 || { tail -n 20 rm.log; exit 1; }
            cat sva.fa.out
            for strand in forward revcomp; do
              n=$(awk -v s="_${strand}" "\$5 ~ s && \$10 == \"SVA_F\"" sva.fa.out | wc -l)
              echo "${strand}: ${n} SVA_F line(s)"
              [ "${n}" -eq 1 ] || { echo "expected 1 SVA_F line on the ${strand} strand" >&2; exit 1; }
            done
          '

      # The --dfam_db / --dfam_extra checks run before extraction and RepeatMasker, so a
      # tiny VCF and a stand-in reference (with --skip_ref_check) reach them. Each must stop
      # with its own message.
      - name: Smoke test - Dfam option checks
        run: |
          set -euo pipefail
          mkdir -p dfam_tests/complete dfam_tests/other_release
          touch dfam_tests/complete/dfam40.0.h5 dfam_tests/other_release/dfam41.curated.hmm.1.h5
          expect_failure() {
            local want="$1"; shift
            if out=$(docker run --rm -v "${PWD}/dfam_tests:/dfam:ro" -v "${PWD}/test:/t:ro" svscanner:ci \
                       svscanner --vcf /t/HG002_subset_mini/HG002_subset_mini.vcf.gz --ref /t/sample.fa \
                       --out /tmp/out --skip_ref_check "$@" 2>&1); then
              echo "::error::expected failure for: $*"; exit 1
            fi
            grep -qF -- "${want}" <<< "${out}" || { echo "${out}"; echo "::error::missing message '${want}' for: $*"; exit 1; }
            echo "ok: $* -> ${want}"
          }
          expect_failure "--dfam_dir has been removed" --dfam_dir /dfam/complete
          expect_failure "mutually exclusive" --dfam_db /dfam/complete --dfam_extra /dfam/other_release
          expect_failure "the base file of a complete Dfam database" --dfam_extra /dfam/complete
          expect_failure "not from the built-in Dfam release" --dfam_extra /dfam/other_release
          expect_failure "use --dfam_extra" --dfam_db /dfam/other_release
          # These reach RepeatMasker's library preparation (~20 s each), where it would
          # carry on curated-only; SVscanner must refuse. Human has no uncurated families
          # in Dfam at all; mouse has 4,692, but their partitions are not built in.
          expect_failure "Dfam has no uncurated families" --uncurated
          expect_failure "is not installed" --uncurated --species "mus musculus"

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
